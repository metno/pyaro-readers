# connection between pyaerocom and ACTRIS-EBAS variables
[variables]
#prototype
# the order in the list below is preserved and determines the order the data is read
#[variables.<pyaerocom var name>]
#actris_variable = [<list of actris variables>] (according to the ACTRIS vocabulary)
#actris_matrix = [<list of actris matrixes>] (unused atm)
#ebas_component = [<list of ebas component names>]
#ebas_matrix = [<list of ebas matrix names>]

[variables.concNno]
actris_variable = ["nitric oxide mass concentration"]
actris_matrix = ["inorganics"]
ebas_component = ["nitrogen_monoxide"]
ebas_matrix = ["air"]
standard_names = ["mass_concentration_of_nitrogen_monoxide_expressed_as_nitrogen_in_air"]
units = 'ug N/m3'

[variables.concNno2]
actris_variable = ["nitrogen dioxide mass concentration"]
actris_matrix = ["inorganics"]
ebas_component = ["nitrogen_dioxide"]
ebas_matrix = ["air"]
