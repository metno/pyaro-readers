units = 'ug N/m3'

# No idea what to search for
[variables.concNtno3]
actris_variable = ["gas and particle nitric acid and nitrate mass concentration"]
actris_matrix = ["inorganics"]
ebas_component = ["sum_nitric_acid_and_nitrate"]
ebas_matrix = ["air+aerosol"]
standard_names = ["mass_concentration_of_sum_nitric_acid_and_nitrate_expressed_as_nitrogen_in_aerosol"]

[variables.concNhno3]
